name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'

    - name: Run golangci-lint (Latest)
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

    - name: Test with Race Detector
      run: go test -race -count 100 ./...

    - name: Build
      run: go build -v ./cmd/server ./cmd/client