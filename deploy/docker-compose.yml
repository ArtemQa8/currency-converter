name: currency-converter

services:
  redis:
    image: redis:7-alpine
    container_name: converter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: converter-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=converter
      - POSTGRES_PASSWORD=converter
      - POSTGRES_DB=converter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converter -d converter"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: converter-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PG_URL=postgres://converter:converter@postgres:5432/converter?sslmode=disable
      - REDIS_URL=redis:6379
      - REDIS_TTL=3h
      - CBR_URL=https://www.cbr-xml-daily.ru/daily_json.js
      - RATES_FILE=/app/data/rates.json
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: